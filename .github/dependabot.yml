# Weekly dependency updates, grouped so each ecosystem opens at most one
# routine pull request a week. Security updates are not grouped and arrive as
# soon as an advisory is published. A release must be a week old before it is
# proposed, which keeps a freshly compromised version out of the lockfile.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      js-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Actions are pinned to commit hashes; Dependabot moves the hash and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
